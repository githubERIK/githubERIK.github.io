<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Web Page</title>
</head>

<body>
    <div>
        <p>Company Web Page?</p>
        <input id="company-web-page" />
        <button id="flow-company-web-page">OK</button>
    </div>

    <script>
        const nextPageButton = document.getElementById('flow-company-web-page')
        const validationPattern = /\S+\.\S+/;

        let field = document.getElementById("company-web-page");
        if (sessionStorage.getItem("web_page")) {
            field.value = sessionStorage.getItem("web_page");
        }

        nextPageButton.addEventListener('click', () => {
            if (field.value.match(validationPattern)) {
                window.location.href = 'flow5.html';
            }
        });

        field.addEventListener("change", () => {
            if (field.value.match(validationPattern)) {
                sessionStorage.setItem("web_page", field.value);
            }
        });
    </script>
</body>

</html>
