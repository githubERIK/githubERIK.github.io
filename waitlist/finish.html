<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_waitlist.css">
    <title>Finish Joining Waitlist</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>

<body>
    <div class="topbar">
        <div class="logo">
            <div class="title"><a href="../index.en.html" class="logo-title">Creatissimi Marketing</a></div>
        </div>
    </div>
    <main class="wrap">
        <div>
            <div>
                <p>In submitting this form, you agree to</p>
                <ol>
                    <li>receive information from Creatissimi Marketing related to services you selected</li>
                    <li>the form data shall move through servers located in the EU</li>
                    <li>the form data shall be stored in a Google Sheet spreadsheet</li>
                </ol>
            </div>
        </div>
        <button class="button" id="flow-i-agree">I agree</button>
    </main>
    <script>
        function formComplete(
            companyName,
            role,
            webPage,
            packages,
            email,
            startTime,
            consent
        ) {
            const payload = {
                company_name: companyName,
                role: role,
                web_page: webPage,
                package: packages.toString(),
                email: email,
                start_time: startTime,
                consent: consent
            };


            fetch('https://changelogapi.eu/vorm/forms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            })
                .then(response => {
                    if (response.ok) {
                        return response.json().catch(() => null);
                    } else {
                        return response.text().then(text => { throw new Error(text); });
                    }
                })
                .then(data => {
                    console.log('POST successful', data);
                    window.location.href = 'success.html';
                })
                .catch(err => {
                    console.error('POST failed', err);
                    window.location.href = 'error.html';
                });
        }

        const companyName = sessionStorage.getItem("company_name");
        if (!companyName) {
            // ...
        }

        const role = sessionStorage.getItem("role")
        if (!role) {
            // ...
        }

        const webPage = sessionStorage.getItem("web_page")
        if (!webPage) {
            // ...
        }

        const mg = sessionStorage.getItem('package-social-media-management') === 'true';
        const ct = sessionStorage.getItem('package-content-creation') === 'true';
        if (!mg && !ct) {
            // ...
        }
        const packages = [];
        if (mg) packages.push("social media");
        if (ct) packages.push("content creation");


        const email = sessionStorage.getItem("email")
        if (!email) {
            // ...
        }

        const startTime = sessionStorage.getItem("start")
        if (!startTime) {
            // ...
        }

        document.getElementById('flow-i-agree').addEventListener('click', () => {
            formComplete(
                companyName,
                role,
                webPage,
                packages,
                email,
                startTime,
                true
            )
        });
    </script>
</body>

</html>
